<head>

<meta name="color-scheme" content="light dark">
<title>우리집 아침신문 지난 호</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<style>
:root { --paper: #ffffff; --ink: #1e2433; --muted: #5b6375; --rule: #e3e5ea; --sat: #2a5bd7; --sun: #c8352b;
  --serif: "Noto Serif KR", "AppleMyungjo", "Nanum Myeongjo", serif;
  --sans: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
@media (prefers-color-scheme: dark) { :root { --paper: #15171c; --ink: #e8eaf0; --muted: #a3aabb; --rule: #2c303a; --sat: #7fa2ff; --sun: #ff8a7f; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 var(--sans); word-break: keep-all; overflow-wrap: anywhere; }
.wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
h1 { font: 800 26px/1.3 var(--serif); margin: 0 0 4px; padding-bottom: 16px; border-bottom: 3px double var(--ink); }
ul { list-style: none; margin: 0; padding: 0; }
li a { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; }
li a:focus-visible { outline: 2px solid var(--sat); outline-offset: 2px; }
.d { font: 800 32px/1 var(--serif); text-align: right; }
.d.sat { color: var(--sat); } .d.sun { color: var(--sun); }
.when { display: block; font-size: 14px; color: var(--muted); }
.what { font-weight: 600; }
.back { display: inline-block; margin-top: 24px; font-weight: 700; color: var(--ink); }
.empty { color: var(--muted); padding: 16px 0; }
</style>
</head>
<body>

    <li><a href="https://taeyoon6095.github.io/news-briefing/docs/2026-11-08/"><span class="d sun">8</span><span><span class="when">2026년 11월 8일 (일)</span><span class="what">특검법 국회 통과, 여야 정면 충돌</span></span></a></li>
